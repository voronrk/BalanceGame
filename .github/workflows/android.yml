name: Android Build

on:
  push:
    branches: [ "master" ] # Исправлено на master, как у вас

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Gradle Wrapper (Cloud Fix)
      run: |
        if [ ! -f gradlew ]; then
          echo "gradlew not found. Generating it in the cloud..."
          curl -sL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          rm -rf gradle-8.2 gradle.zip
          chmod +x gradlew
        else
          chmod +x gradlew
        fi

    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BalanceGame-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
